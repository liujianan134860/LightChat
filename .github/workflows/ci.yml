name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  module-tests:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: core-model
            task: ":core:model:test"
          - module: core-network
            task: ":core:network:test"
          - module: core-database
            task: ":core:database:testDebugUnitTest"
          - module: core-data
            task: ":core:data:testDebugUnitTest"
          - module: core-domain
            task: ":core:domain:test"
          - module: shared-protocol
            task: ":shared:protocol:test"
          - module: feature-auth
            task: ":feature:auth:testDebugUnitTest"
          - module: feature-conversation
            task: ":feature:conversation:testDebugUnitTest"
          - module: feature-social
            task: ":feature:social:testDebugUnitTest"
          - module: app
            task: ":app:testDebugUnitTest"
          - module: server
            task: ":server:test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run module tests
        run: ./gradlew ${{ matrix.task }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.module }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  quality:
    name: Android Lint And Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Build artifacts
        run: ./gradlew :app:assembleDebug :server:installDist

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
